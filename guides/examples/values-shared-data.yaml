# Helm values for a shared-data StarRocks cluster on S3, for the
# `starrocks/starrocks` chart (cluster only, operator installed separately).
#
# Original example written for this repository. Replace every <placeholder>.
#
#   helm install sr starrocks/starrocks -n starrocks -f values-shared-data.yaml
#
# For the `kube-starrocks` umbrella chart, indent everything below under a
# top-level `starrocks:` key.

timeZone: UTC

# Sets the root password once, at install. Create the Secret first:
#   kubectl -n starrocks create secret generic starrocks-root-password \
#     --from-literal=password='<password>'
# Keep this block unchanged on later upgrades.
# With Argo CD, set isInstall to false after the first sync.
initPassword:
  enabled: true
  isInstall: true
  passwordSecret: starrocks-root-password

metrics:
  serviceMonitor:
    enabled: false          # true if you run the Prometheus Operator
    interval: 15s
    labels: {}

starrocksCluster:
  name: sr
  enabledBe: false
  enabledCn: true
  waitForFullRollout: true
  componentValues:
    runAsNonRoot: true
    serviceAccount: starrocks-sa     # must exist and carry the IAM role

starrocksFESpec:
  replicas: 3
  image:
    repository: starrocks/fe-ubuntu
    tag: "<version>"
  resources:
    requests:
      cpu: 8
      memory: 16Gi
    limits:
      cpu: 8
      memory: 16Gi
  storageSpec:
    name: fe
    storageClassName: <storage-class>
    storageSize: 100Gi
    logStorageSize: 10Gi
  feEnvVars:
    - name: LOG_CONSOLE
      value: "1"
    - name: MYSQL_PWD
      valueFrom:
        secretKeyRef:
          name: starrocks-root-password
          key: password
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: ["fe"]
          topologyKey: kubernetes.io/hostname
  config: |
    LOG_DIR = ${STARROCKS_HOME}/log
    DATE = "$(date +%Y%m%d-%H%M%S)"
    JAVA_OPTS="-Dlog4j2.formatMsgNoLookups=true -Xmx12g -XX:+UseG1GC -Xlog:gc*:${LOG_DIR}/fe.gc.log.$DATE:time"
    http_port = 8030
    rpc_port = 9020
    query_port = 9030
    edit_log_port = 9010
    mysql_service_nio_enabled = true
    sys_log_level = INFO
    min_graceful_exit_time_second = 25
    run_mode = shared_data
    cloud_native_meta_port = 6090
    cloud_native_storage_type = S3
    enable_load_volume_from_conf = true
    aws_s3_path = <bucket>/<prefix>
    aws_s3_region = <region>
    aws_s3_use_aws_sdk_default_behavior = true

starrocksCnSpec:
  image:
    repository: starrocks/cn-ubuntu
    tag: "<version>"
  # `replicas` is omitted because autoScalingPolicy is set.
  resources:
    requests:
      cpu: 16
      memory: 64Gi
    limits:
      cpu: 16
      memory: 64Gi
  cnEnvVars:
    - name: LOG_CONSOLE
      value: "1"
    - name: MYSQL_PWD
      valueFrom:
        secretKeyRef:
          name: starrocks-root-password
          key: password
  storageSpec:
    name: cn
    storageClassName: <storage-class>
    storageSize: 500Gi        # cache volume. See guides/06-storage.md for alternatives.
    logStorageSize: 20Gi
  persistentVolumeClaimRetentionPolicy:
    whenScaled: Delete
  autoScalingPolicy:
    version: v2
    minReplicas: 2
    maxReplicas: 10
    hpaPolicy:
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 60
      behavior:
        scaleUp:
          policies:
            - type: Pods
              value: 2
              periodSeconds: 60
        scaleDown:
          policies:
            - type: Pods
              value: 1
              periodSeconds: 120
  config: |
    sys_log_level = INFO
    be_port = 9060
    be_http_port = 8040
    heartbeat_service_port = 9050
    brpc_port = 8060
